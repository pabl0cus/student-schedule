[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "student-schedule-worker"
version = "0.1.0"
description = "Community-powered Windows transcription worker for Student Schedule"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.2.1,<2",
    "httpx>=0.28.1,<1",
    "keyring>=25.6,<26",
    "platformdirs>=4.3,<5",
    "PySide6-Essentials>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]
build = [
    "pyinstaller>=6.15,<7",
]

[project.scripts]
student-schedule-worker = "student_schedule_worker.__main__:main"

[project.gui-scripts]
student-schedule-worker-gui = "student_schedule_worker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/student_schedule_worker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
