name: student-schedule

services:
  transcriber:
    build:
      context: ./transcription_service
    environment:
      TRANSCRIPTION_ALLOWED_ORIGINS: ${TRANSCRIPTION_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
      TRANSCRIPTION_ALLOWED_HOSTS: ${TRANSCRIPTION_ALLOWED_HOSTS:-localhost,127.0.0.1,testserver}
      TRANSCRIPTION_DATA_DIR: /data
      TRANSCRIPTION_MAX_UPLOAD_BYTES: ${TRANSCRIPTION_MAX_UPLOAD_BYTES:-524288000}
      TRANSCRIPTION_MAX_ATTACHMENT_BYTES: ${TRANSCRIPTION_MAX_ATTACHMENT_BYTES:-104857600}
      TRANSCRIPTION_MAX_WORKER_RESULT_BYTES: ${TRANSCRIPTION_MAX_WORKER_RESULT_BYTES:-8388608}
      TRANSCRIPTION_LOCAL_WORKER_ENABLED: ${TRANSCRIPTION_LOCAL_WORKER_ENABLED:-false}
      TRANSCRIPTION_COMMUNITY_LEASE_SECONDS: ${TRANSCRIPTION_COMMUNITY_LEASE_SECONDS:-600}
      TRANSCRIPTION_COMMUNITY_MAX_ATTEMPTS: ${TRANSCRIPTION_COMMUNITY_MAX_ATTEMPTS:-5}
      TRANSCRIPTION_AUDIO_PREPARATION_ENABLED: ${TRANSCRIPTION_AUDIO_PREPARATION_ENABLED:-true}
      TRANSCRIPTION_AUDIO_PREPARATION_MAX_ATTEMPTS: ${TRANSCRIPTION_AUDIO_PREPARATION_MAX_ATTEMPTS:-3}
      TRANSCRIPTION_AUDIO_PREPARATION_TIMEOUT_SECONDS: ${TRANSCRIPTION_AUDIO_PREPARATION_TIMEOUT_SECONDS:-21600}
      TRANSCRIPTION_MAX_PREPARED_AUDIO_BYTES: ${TRANSCRIPTION_MAX_PREPARED_AUDIO_BYTES:-524288000}
      TRANSCRIPTION_WORKER_TOKEN_PEPPER: ${TRANSCRIPTION_WORKER_TOKEN_PEPPER:-}
      TRANSCRIPTION_ADMIN_USERNAME: ${TRANSCRIPTION_ADMIN_USERNAME:-}
      TRANSCRIPTION_ADMIN_PASSWORD_HASH: ${TRANSCRIPTION_ADMIN_PASSWORD_HASH:-}
      TRANSCRIPTION_ADMIN_SESSION_SECRET: ${TRANSCRIPTION_ADMIN_SESSION_SECRET:-}
      TRANSCRIPTION_SECURE_COOKIES: ${TRANSCRIPTION_SECURE_COOKIES:-false}
    volumes:
      - transcription-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        VITE_GA_TRACKING_ID: ${VITE_GA_TRACKING_ID:-}
        VITE_ADMIN_PATH: ${VITE_ADMIN_PATH:-}
        VITE_LOCAL_ADMIN_PATH: ${VITE_LOCAL_ADMIN_PATH:-}
    depends_on:
      transcriber:
        condition: service_healthy
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:80'
    networks:
      default:
      caddy_proxy:
        aliases:
          - student-schedule-kpi-web
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  transcription-data:

networks:
  caddy_proxy:
    external: true
    name: home-services_default
