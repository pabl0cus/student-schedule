user  nginx;
worker_processes  2;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    gzip  on;

    server {
        listen       80;
        listen  [::]:80;

        # 500 MiB recording payload plus up to 1 MiB of multipart metadata.
        client_max_body_size 501M;

        location = /healthz {
            default_type application/json;
            return 200 '{ "status": "ok" }';
        }

        location = /recordings-api {
            return 308 /recordings-api/;
        }

        location /recordings-api/ {
            proxy_pass http://transcriber:8011/;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Prefix /recordings-api;
            proxy_set_header X-KPI-Local-Request 1;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }

        # Native community workers use a narrow, token-authenticated API at the public origin.
        # Keep Authorization out of the access-log format and preserve byte ranges for resumable media downloads.
        location /community/v1/ {
            client_max_body_size 8M;
            proxy_pass http://transcriber:8011/community/v1/;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }

        location / {
            root  /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri /index.html;
        }
    }
}
